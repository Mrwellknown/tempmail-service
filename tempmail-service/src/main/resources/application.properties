spring.datasource.url=jdbc:h2:mem:tempmaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Port 25 is standard in production, but requires root/admin permissions.
# We use 2525 for local development and testing.
tempmail.smtp.port=2525